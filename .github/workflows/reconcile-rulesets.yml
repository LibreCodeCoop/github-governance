name: Reconcile repository rulesets

on:
  workflow_call:
    inputs:
      organization:
        description: GitHub organization to reconcile
        required: true
        type: string
      config-path:
        description: Path to governance config in the caller repository
        required: false
        default: governance.config.json
        type: string
      environment:
        description: Caller environment containing the GitHub App credentials
        required: false
        default: ruleset-sync
        type: string
      apply:
        description: Apply planned changes instead of dry-running
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build governance CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build CLI
        run: npm run build

      - name: Upload CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-governance-cli
          path: dist/
          retention-days: 1

  discover:
    name: Discover public repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repositories: ${{ steps.repositories.outputs.repositories }}

    steps:
      - name: List repositories
        id: repositories
        env:
          GH_TOKEN: ${{ github.token }}
          ORGANIZATION: ${{ inputs.organization }}
        run: |
          repositories="$(
            gh api               --paginate               "orgs/$ORGANIZATION/repos?type=public&per_page=100"               --jq '.[] | select(.archived == false) | .name' |
              jq -Rsc 'split("\n") | map(select(length > 0))'
          )"
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

  reconcile:
    name: Reconcile ${{ inputs.organization }}/${{ matrix.repository }}
    needs:
      - build
      - discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}

    steps:
      - name: Checkout caller configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: caller

      - name: Download governance CLI
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: github-governance-cli
          path: governance/dist

      - name: Generate repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RULESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RULESET_APP_PRIVATE_KEY }}
          owner: ${{ inputs.organization }}
          repositories: ${{ matrix.repository }}
          permission-administration: write

      - name: Reconcile rulesets
        env:
          APPLY: ${{ inputs.apply }}
          CONFIG_PATH: ${{ format('{0}/caller/{1}', github.workspace, inputs.config-path) }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ORGANIZATION: ${{ inputs.organization }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          args=(
            --repo "$ORGANIZATION/$REPOSITORY"
            --config "$CONFIG_PATH"
          )

          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply)
          fi

          node governance/dist/cli.js "${args[@]}"
