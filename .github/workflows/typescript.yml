name: TypeScript

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify native TypeScript action runtime
        shell: bash
        run: |
          set +e
          output="$(node src/cli.ts 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "Specify exactly one of --org OWNER or --repo OWNER/REPO" <<< "$output"

          set +e
          output="$(node src/discover-repositories.ts 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "Usage: discover-repositories ORGANIZATION" <<< "$output"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Build CLI
        run: npm run build
