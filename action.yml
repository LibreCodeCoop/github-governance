name: Reconcile repository rulesets
description: Plan or apply repository rulesets with the shared LibreCode governance engine

inputs:
  token:
    description: GitHub token with administration read permission for plan, write for apply
    required: true
  repository:
    description: Repository in OWNER/REPO form (exclusive with organization)
    required: false
  organization:
    description: Plan or apply governance across public repositories in an organization
    required: false
  config:
    description: Path to caller governance config
    required: true
  apply:
    description: Apply changes instead of dry-running
    required: false
    default: 'false'
  allow-drift:
    description: Report drift without failing the plan; operational errors still fail
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false


    - name: Reconcile rulesets
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_ORGANIZATION: ${{ inputs.organization }}
        CONFIG_PATH: ${{ inputs.config }}
        APPLY: ${{ inputs.apply }}
        ALLOW_DRIFT: ${{ inputs.allow-drift }}
      working-directory: ${{ github.action_path }}
      run: |
        args=(--config "$CONFIG_PATH")

        if [[ -n "$TARGET_REPOSITORY" && -n "$TARGET_ORGANIZATION" ]]; then
          echo '::error::Specify repository or organization, not both'
          exit 2
        fi
        if [[ -n "$TARGET_ORGANIZATION" ]]; then
          args+=(--org "$TARGET_ORGANIZATION")
        else
          args+=(--repo "$TARGET_REPOSITORY")
        fi
        if [[ "$APPLY" == "true" ]]; then
          args+=(--apply)
        fi
        if [[ "$ALLOW_DRIFT" == "true" ]]; then
          args+=(--allow-drift)
        fi

        node src/cli.ts "${args[@]}"
