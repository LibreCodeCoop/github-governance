name: Discover public repositories
description: Discover all public, non-archived repositories in a GitHub organization

inputs:
  organization:
    description: GitHub organization login
    required: true

outputs:
  repositories:
    description: JSON array of repository names
    value: ${{ steps.discover.outputs.repositories }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Install governance dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm install --ignore-scripts

    - name: Build governance CLI
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm run build

    - name: Discover repositories
      id: discover
      shell: bash
      env:
        ORGANIZATION: ${{ inputs.organization }}
      working-directory: ${{ github.action_path }}/..
      run: |
        repositories="$(node dist/discover-repositories.js "$ORGANIZATION")"
        echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
